  <!-- Command token (Choppe Shoppe), after the owner's drawing (design/art/segnalino-comando/CommandToken_utente.svg,
       2026-11-17) matched to the token printed in the Choppe Shoppe rulebook, p. 3: a diamond with rounded tips
       over a square with rounded corners (tips 0.18, square half-side 0.64, corners 0.08 of the radius, fitted
       to the printed outline), warm off-white with a faint grain, a sharp navy star 0.47 of the radius.
       The shadow is the interface's, not the token's. -->
  <defs>
    <filter id="ctok-grain" x="0" y="0" width="100%" height="100%">
