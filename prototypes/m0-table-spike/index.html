<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRV — prototipo M0 (tavolo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1a120c; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; left: 16px; top: 16px; padding: 12px 16px; border-radius: 10px;
    background: rgba(20, 14, 10, .82); color: #f3e6d0; max-width: 300px;
    box-shadow: 0 4px 18px rgba(0,0,0,.45); line-height: 1.35;
  }
  #hud h1 { font-family: 'League Gothic', Impact, sans-serif; font-weight: 400; letter-spacing: .5px;
    font-size: 30px; margin: 0 0 6px; color: #f6c46a; }
  #hud p { margin: 4px 0; font-size: 14px; }
  #hud .row { display: flex; gap: 8px; margin: 10px 0 6px; }
  #hud button {
    flex: 1; min-height: 44px; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
    background: #e8742a; color: #1a120c; cursor: pointer;
  }
  #hud button.alt { background: #3b2d22; color: #f3e6d0; }
  #hud button:disabled { opacity: .5; cursor: default; }
  #result { font-family: 'League Gothic', Impact, sans-serif; font-size: 44px; color: #fff; min-height: 48px; }
  #note { font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<div id="hud">
  <h1>Thunder Road Vendetta</h1>
  <p>Prototipo M0 — il tavolo</p>
  <div class="row">
    <button id="roll">Tira il dado</button>
    <button id="flip" class="alt">Gira tessera</button>
  </div>
  <div id="result"></div>
  <p>Clic o tocco su una casella: l'auto ci va.<br>Trascina per ruotare la vista, rotella per lo zoom.</p>
  <p id="note"></p>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
