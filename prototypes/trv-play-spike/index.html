<!-- PROTOTYPE - NOT FOR PRODUCTION. Partita hot seat giocabile: grafica vettoriale, interfaccia dallo schizzo dell'utente. -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunder Road Vendetta — hot seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
<style>
  :root { --top: 152px; --bar: 58px; --bottom: 360px; --stripw: 1000px;
    --ink: #f3e6d0; --bg: #1a120c; --card: #24180f; --acc: #f6c46a; --hot: #4cff7a; --who: #f6c46a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 14px/1.3 system-ui, sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; }
  /* The panel under the table is fixed: its sizes are set once per game by fit() in main.ts. */
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
  .gothic { font-family: 'League Gothic', Impact, sans-serif; letter-spacing: .4px; }
  svg { display: block; }

  /* Top: floating bubbles over the map (round, players in turn order, road die). No strip. */
  #top { position: fixed; left: 0; right: 0; top: var(--bar); display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; pointer-events: none; z-index: 2; }
  .bubble { pointer-events: auto; background: rgba(30,21,14,.88); border: 1px solid rgba(255,255,255,.09); border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,.45); backdrop-filter: blur(6px); }
  #roundinfo { padding: 8px 14px; text-align: center; line-height: 1; }
  #roundinfo small { display: block; font-size: 11px; letter-spacing: 2px; opacity: .7; }
  #roundinfo b { font-size: 34px; font-weight: 400; color: var(--acc); }
  #roundinfo span { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
  #players { flex: 1; display: flex; gap: 12px; justify-content: center; flex-wrap: nowrap; min-width: 0; }
  .pl { --c: #888; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 8px 14px 8px 10px; min-width: 0;
    transition: box-shadow .3s, transform .3s; }
  .pl .av { width: 52px; height: 52px; grid-row: 1 / span 2; }
  /* A crew leader's portrait takes the place of the player's initial. */
  .pl .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 20%; border: 2px solid var(--c); box-sizing: border-box; display: block; }
  .pl .who { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .pl .nm { font-size: 24px; line-height: 1; }
  .pl .tag { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 6px; border-radius: 8px; background: var(--c); color: #16100b; font-weight: 700; }
  .pl .tag.quiet { background: #3b2d22; color: var(--ink); font-weight: 500; }
  .pl .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pl .dice-row { display: flex; gap: 3px; }
  .pl .dice-row svg { width: 22px; height: 22px; }
  .pl .dice-row svg.used { opacity: .22; }
  .pl .cars { display: flex; gap: 4px; }
  .car { min-width: 24px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--c); color: #16100b; font-weight: 800; font-size: 11px;
    display: flex; align-items: center; justify-content: center; gap: 2px; }
  .car.inop { background: repeating-linear-gradient(45deg, #5a5a5a 0 4px, #3c3c3c 4px 8px); color: #ffd23a; }
  .car.elim { background: #2a211b; color: #6f6257; text-decoration: line-through; }
  .car i { width: 5px; height: 5px; border-radius: 50%; background: #d42f30; display: inline-block; }
  .pl .extra { font-size: 13px; opacity: .85; }
  .pl .extra b { color: var(--c); font-weight: 700; }
  .pl.turn { box-shadow: 0 0 0 2px var(--c), 0 0 26px 6px var(--c); transform: translateY(2px) scale(1.03); animation: glow 1.6s ease-in-out infinite; }
  .pl.decides:not(.turn) { box-shadow: 0 0 0 2px var(--c); }
  .pl.out { opacity: .45; filter: grayscale(.7); }
  @keyframes glow { 50% { box-shadow: 0 0 0 2px var(--c), 0 0 40px 12px var(--c); } }
  .road { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .road svg { width: 48px; height: 48px; }
  .road span { font-size: 15px; line-height: 1; text-align: right; }

  /* Bar: the turn's phases, the prompt, actions, tools */
  #bar { position: fixed; left: 0; right: 0; height: var(--bar); top: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: linear-gradient(rgba(34,24,16,.96), rgba(22,15,10,.98)); border-bottom: 1px solid #4a3523; box-shadow: 0 8px 20px rgba(0,0,0,.35); box-sizing: border-box; z-index: 3; }
  #steps { display: flex; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .st { position: relative; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 20px 0 26px; margin-left: -12px; background: #33271d; color: #9c8a73;
    clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%, 13px 50%); transition: background .25s, color .25s, transform .25s; white-space: nowrap; }
  .st:first-child { margin-left: 0; clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%); padding-left: 14px; }
  .st b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.35); font-size: 12px; font-weight: 700; }
  .st span { font-family: 'League Gothic', Impact, sans-serif; font-size: 24px; letter-spacing: .6px; }
  .st small { font-size: 12px; opacity: .8; }
  .st.done { background: color-mix(in srgb, var(--who) 38%, #33271d); color: #e9dcc6; }
  .st.on { background: var(--who); color: #16100b; transform: scale(1.06); z-index: 1; }
  .st.on b { background: rgba(0,0,0,.75); color: var(--who); }
  .st.off span { text-decoration: line-through; opacity: .6; }
  #prompt { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  #prompt b { font-family: 'League Gothic', Impact, sans-serif; font-weight: 400; font-size: 32px; margin-right: 8px; }
  #actions { position: fixed; display: none; gap: 8px; transform: translateX(-50%); z-index: 4; padding: 7px; border-radius: 14px; animation: callout 1.5s ease-in-out infinite;
    background: rgba(20,14,10,.85); box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  #actions button, .tool { min-height: 32px; padding: 4px 12px; font: inherit; font-weight: 600; border: 0; border-radius: 9px;
    background: #e8742a; color: #1a120c; cursor: pointer; white-space: nowrap; }
  #actions button { min-height: 46px; padding: 8px 18px; font-size: 17px; }
  .tool { background: #3b2d22; color: var(--ink); font-weight: 500; }
  /* Bar tools say what they do: a sign and a word. */
  #bar .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 64px; min-height: 46px; padding: 3px 10px; font-size: 19px; line-height: 1; }
  #bar .tool small { font-size: 12.5px; letter-spacing: .3px; opacity: .85; }
  #bar .tool:disabled { opacity: .35; cursor: default; }
  /* The question over the choices (or alone, where the player must act on the table). */
  #actions { flex-wrap: wrap; justify-content: center; width: max-content; max-width: 280px; }
  #actions .q { flex-basis: 100%; text-align: center; font: 400 24px/1.05 'League Gothic', Impact, sans-serif; letter-spacing: .5px; color: var(--ink); padding: 2px 8px; }
  #replay.fresh { background: #d42f30; color: #fff; animation: callout 1.2s ease-in-out infinite; }
  #replaybadge { position: fixed; left: 50%; top: calc(var(--top) + 8px); transform: translateX(-50%); display: none; align-items: center; gap: 9px; z-index: 6; padding: 6px 16px;
    font: 400 26px/1 'League Gothic', Impact, sans-serif; letter-spacing: 2px; color: #fff; background: rgba(20,14,10,.9); border: 2px solid #d42f30; border-radius: 10px; }
  #replaybadge.show { display: flex; }
  #replaybadge i { width: 12px; height: 12px; border-radius: 50%; background: #ff3b30; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  #actions.only { pointer-events: none; animation: none; padding: 5px 8px; box-shadow: 0 0 0 2px var(--who), 0 6px 18px rgba(0,0,0,.5); }
  /* The quieter choice is still a choice: light enough to be seen at once. */
  #actions button.quiet { background: #efe3cf; color: #1a120c; font-weight: 600; }
  @keyframes callout { 0%, 100% { box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 0 2px var(--who); } 50% { box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 0 5px var(--who), 0 0 22px 4px var(--who); } }
  .tool.offed { opacity: .45; }
  #actions button.danger { background: #8c2a20; color: #fff; }

  /* Bottom: the player's strip alone, no background: the table shows around it. Only the boards
     take clicks; elsewhere the pointer reaches the table (pan, zoom, dice). */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 12px 4px; pointer-events: none; z-index: 2; }
  #strip { width: var(--stripw); }
  #strip > svg { width: 100%; height: auto; display: block; pointer-events: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
  #strip [data-drop], #strip [data-car] { pointer-events: auto; cursor: pointer; }
  /* An upgrade card sits in its dashboard's recess with only its name showing; with the pointer on
     the card it rises and shows its effect (the rise, --rise, is set by the drawing). */
  #strip > svg { overflow: visible; }
  #strip .upcard { transition: transform .22s ease; }
  #strip .upcard:hover { transform: translateY(var(--rise)); }
  #strip .upcard .upbody { opacity: 0; transition: opacity .15s; }
  #strip .upcard:hover .upbody { opacity: 1; }
  /* The crew leader's power: a tab behind the command board, pulled out to the left by the pointer. */
  #strip .leadtab { pointer-events: auto; cursor: help; transition: transform .22s ease; }
  #strip .leadtab:hover { transform: translateX(var(--pull)); }
  #strip .loose { display: flex; align-items: center; height: calc(var(--stripw) / 4.1); }
  #strip .loose svg { height: 80%; width: auto; }
  /* Upgrade cards, shaped as cards: the draft, and the hand to drag onto the cars. */
  .ucard { --w: 210px; width: var(--w); aspect-ratio: 63 / 88; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 8px;
    background: #f3e6d0; color: #1a120c; border-radius: 12px; border: 3px solid var(--c); box-shadow: 0 8px 20px rgba(0,0,0,.55); text-align: left; }
  .ucard > b { display: block; background: var(--c); color: #16100b; border-radius: 6px; padding: 5px 8px 3px; font-size: 25px; font-weight: 400; line-height: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ucard .art { flex: 1; min-height: 40px; border-radius: 6px; background: repeating-linear-gradient(135deg, #e3d4ba 0 10px, #ddccaf 10px 20px); }
  .ucard p { margin: 0; font-size: 16px; line-height: 1.28; font-weight: 500; }
  #leaderpick .hand { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  #leaderpick .pickcard { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 14px; transition: transform .15s; }
  #leaderpick .pickcard .ucard { --w: 230px; }
  #leaderpick .pickcard:hover, #leaderpick .pickcard:focus-visible { transform: translateY(-8px); outline: none; }
  #hand { position: fixed; left: 50%; bottom: calc(var(--bottom) + 14px); transform: translateX(-50%); display: flex; gap: 16px; z-index: 4; }
  #hand .ucard { --w: 180px; cursor: grab; touch-action: none; transition: transform .15s; }
  #hand .ucard p { font-size: 15px; }
  #hand .ucard:hover { transform: translateY(-6px); }
  #hand .ucard[data-sel] { transform: translateY(-12px); box-shadow: 0 0 0 4px var(--hot), 0 10px 24px rgba(0,0,0,.6); }
  .ucard.flying { position: fixed; z-index: 9; pointer-events: none; --w: 180px; transform: rotate(-4deg) scale(1.04); cursor: grabbing; }
  .ucard.flying p { font-size: 15px; }
  .hotzone { cursor: pointer; }

  /* Rolled dice, big, in the middle of the screen; comic words over the action */
  #rolls { position: fixed; left: 50%; bottom: calc(var(--bottom) + 40px); transform: translate(-50%, 12px); display: flex; gap: 18px; padding: 12px 20px 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 5; border-radius: 18px;
    background: rgba(20,14,10,.9); border: 2px solid var(--acc); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #rolls.show { opacity: 1; transform: translate(-50%, 0); }
  #rolls .roll { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 96px; }
  #rolls .roll svg { width: 84px; height: 84px; }
  #rolls .roll b { font-family: 'League Gothic', Impact, sans-serif; font-weight: 400; font-size: 22px; color: var(--acc); line-height: 1; }
  #rolls .roll span { font-size: 13px; max-width: 150px; text-align: center; line-height: 1.15; }
  /* A damage token turned over: bigger than a die, in the colour of the car's crew. */
  #rolls .roll.dmg { min-width: 190px; padding-right: 14px; border-right: 2px solid rgba(255,255,255,.12); }
  #rolls .roll.dmg:only-child { border-right: 0; padding-right: 0; }
  #rolls .roll.dmg small { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--c); font-weight: 700; }
  #rolls .roll.dmg .tok { display: block; animation: tokflip .55s ease-out; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  #rolls .roll.dmg .tok svg { width: 132px; height: 120px; }
  #rolls .roll.dmg b { font-size: 30px; color: #ff6a5a; }
  #rolls .roll.dmg span { font-size: 14px; max-width: 210px; }
  @keyframes tokflip { 0% { transform: rotateY(180deg) scale(.5); opacity: 0; } 55% { transform: rotateY(60deg) scale(1.12); opacity: 1; } 100% { transform: none; } }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .word { position: absolute; transform: translate(-50%, -50%); font: 400 54px 'League Gothic', Impact, sans-serif; letter-spacing: 1px; color: #fff;
    -webkit-text-stroke: 2px #16100b; paint-order: stroke fill; text-shadow: 0 4px 0 #16100b, 0 0 24px var(--wc, #ff6a2a); white-space: nowrap; will-change: transform, opacity; }
  .word.big { font-size: 84px; }

  /* Dice are drawn in 3D by an overlay; their SVG stays for layout and clicks. */
  [data-die3d] { opacity: 0; }
  #actions button.shoot { background: #ffd23a; }
  #roundbox { position: fixed; left: 50%; top: calc(var(--top) + 30px); transform: translate(-50%, -10px) scale(.96); opacity: 0; pointer-events: none;
    background: rgba(20,14,10,.94); border: 2px solid var(--acc); border-radius: 14px; padding: 10px 18px 14px; z-index: 6; transition: opacity .25s, transform .25s; }
  #roundbox.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #roundbox h2 { margin: 0 0 6px; font-size: 40px; font-weight: 400; color: var(--acc); text-align: center; }
  #roundbox .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #roundbox .row .av { width: 30px; height: 30px; }
  #roundbox .row span { font-size: 22px; min-width: 90px; }
  #roundbox .row svg { width: 40px; height: 40px; }
  #roundbox .row em { margin-left: 10px; font-size: 12px; color: var(--acc); font-style: normal; }
  .road.glow { box-shadow: 0 0 0 2px #f2c230, 0 0 26px 6px #f2c230; }
  .road.glow span { color: #f2c230; }
  #actions button.road { background: #f2c230; }
  #handoff { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; z-index: 8;
    background: rgba(20,14,10,.95); border: 4px solid var(--who, var(--acc)); border-radius: 16px; padding: 14px 34px 16px; text-align: center;
    box-shadow: 0 0 40px var(--who, transparent); transition: opacity .25s, transform .25s; }
  #handoff.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #handoff small { display: block; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: .8; }
  #handoff b { display: block; font-size: 54px; font-weight: 400; line-height: 1.05; color: var(--who); }
  #handoff span { display: block; margin-top: 4px; font-size: 16px; font-weight: 600; }
  #toast { position: fixed; left: 50%; top: calc(var(--top) + 12px); transform: translate(-50%, -8px); min-width: 280px; max-width: 70vw;
    background: rgba(20,14,10,.92); border: 2px solid var(--acc); border-radius: 10px; padding: 8px 14px; font-size: 16px; font-weight: 600;
    text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 6; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast div { padding: 2px 0; }
  #ghost { position: fixed; width: 64px; height: 64px; pointer-events: none; z-index: 9; display: none; filter: drop-shadow(0 6px 8px #000); }

  #drawer { position: fixed; right: 0; top: var(--top); bottom: var(--bottom); width: min(380px, 90vw); background: rgba(24,16,10,.97);
    border-left: 2px solid #3b2a1c; overflow: auto; padding: 8px 12px; box-sizing: border-box; display: none; z-index: 3; }
  #drawer div { padding: 3px 0; border-bottom: 1px solid #2c1f15; }
  #drawer img { width: 18px; height: 18px; vertical-align: -4px; margin-right: 3px; }
  .dice { color: #9fd3ff; } .bad { color: #ff9b8a; } .good { color: #9be39b; font-weight: 700; } .turn { color: var(--acc); font-weight: 700; }

  #setup { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,6,3,.85); z-index: 10; }
  #setup .card { background: var(--card); padding: 22px 26px; border-radius: 14px; width: min(520px, 92vw); box-shadow: 0 10px 40px #000; }
  #setup h1 { font: 400 44px 'League Gothic', Impact, sans-serif; color: var(--acc); margin: 0 0 8px; }
  #setup label { display: block; margin: 10px 0 4px; font-weight: 600; }
  #setup input, #setup select { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #5a4330; background: #120c07; color: var(--ink); }
  #setup .names { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  #setup .go { margin-top: 16px; width: 100%; min-height: 48px; font-size: 18px; background: #e8742a; color: #1a120c; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
  #setup label.check { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 2px 0; }
  #setup label.check input { width: 18px; height: 18px; padding: 0; }
  #leaderpick { position: fixed; inset: 0; display: none; place-content: center; gap: 14px; background: rgba(10,6,3,.82); z-index: 9; padding: 16px; }
  #leaderpick h2 { margin: 0; text-align: center; font-size: 40px; font-weight: 400; }
  #leaderpick .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 360px)); gap: 16px; }
  #leaderpick .leader { display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
    background: var(--card); border: 3px solid transparent; border-top: 8px solid var(--c); border-radius: 14px; padding: 16px 18px; min-height: 44px; }
  #leaderpick .pair.cards { grid-template-columns: repeat(4, minmax(0, 250px)); }
  #leaderpick .pair.cards .leader > b { font-size: 28px; }
  #leaderpick .leader:hover, #leaderpick .leader:focus-visible { border-color: var(--c); outline: none; }
  #leaderpick .leader > b { font-size: 34px; font-weight: 400; line-height: 1; }
  #leaderpick .leader small { opacity: .7; text-transform: uppercase; letter-spacing: 1px; }
  #leaderpick .leader p { margin: 6px 0; line-height: 1.35; }
  #leaderpick .leader p i { color: var(--acc); font-style: normal; font-weight: 700; display: block; }
  #leaderpick .leader ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 14px; line-height: 1.3; }
  #leaderpick .leader li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: start; }
  #leaderpick .leader li em { font-style: normal; font-weight: 700; text-align: center; background: #120c07; border-radius: 6px; padding: 2px 0; }
  #leaderpick .stars { margin-top: auto; padding-top: 8px; color: #f3e6c8; }
  #win { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.55); z-index: 8; }
  #win .card { background: var(--card); padding: 24px 30px; border-radius: 14px; text-align: center; }
  #win .big { font: 400 56px 'League Gothic', Impact, sans-serif; color: var(--acc); }
</style>
</head>
<body>
<div id="top">
  <div class="bubble" id="roundinfo"></div>
  <div id="players"></div>
  <div class="bubble road"><span class="gothic">DADO<br>STRADA</span><div id="roaddie"></div></div>
</div>
<div id="fx"></div>
<div id="rolls"></div>
<div id="toast"></div>
<div id="replaybadge"><i></i>INSTANT REPLAY</div>
<div id="handoff"></div>
<div id="roundbox"></div>
<div id="drawer"></div>
<div id="bar">
  <div id="steps"></div>
  <div id="prompt"></div>
  <button class="tool" id="skip" title="Salta l’animazione (barra spaziatrice)"><span>⏭</span><small>Salta</small></button>
  <button class="tool" id="replay" title="Rivedi al rallentatore l’ultimo danno o l’ultima distruzione (R)" disabled><span>⟲</span><small>Replay</small></button>
  <button class="tool" id="home" title="Torna alla vista di tutta la mappa (V)"><span>⌂</span><small>Vista</small></button>
  <button class="tool" id="grid" title="Mostra o nascondi le linee delle caselle (G)"><span>▦</span><small>Griglia</small></button>
  <button class="tool" id="ticker" title="Cronaca della partita"><span>☰</span><small>Cronaca</small></button>
  <button class="tool" id="undo" title="Annulla l'ultima scelta"><span>↶</span><small>Annulla</small></button>
  <button class="tool" id="menu" title="Nuova partita"><span>⟳</span><small>Nuova</small></button>
</div>
<div id="actions"></div>
<div id="leaderpick"></div>
