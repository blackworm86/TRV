<!-- PROTOTYPE - NOT FOR PRODUCTION. Partita hot seat giocabile: grafica vettoriale, interfaccia dallo schizzo dell'utente. -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunder Road Vendetta — hot seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
<style>
  :root { --top: 92px; --bar: 46px; --bottom: 260px; --sh: 240px;
    --ink: #f3e6d0; --bg: #1a120c; --card: #24180f; --acc: #f6c46a; --hot: #4cff7a; --who: #f6c46a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 14px/1.3 system-ui, sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
  .gothic { font-family: 'League Gothic', Impact, sans-serif; letter-spacing: .4px; }
  svg { display: block; }

  /* Top: floating bubbles over the map (round, players in turn order, road die). No strip. */
  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; pointer-events: none; z-index: 2; }
  .bubble { pointer-events: auto; background: rgba(30,21,14,.88); border: 1px solid rgba(255,255,255,.09); border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,.45); backdrop-filter: blur(6px); }
  #roundinfo { padding: 8px 14px; text-align: center; line-height: 1; }
  #roundinfo small { display: block; font-size: 11px; letter-spacing: 2px; opacity: .7; }
  #roundinfo b { font-size: 34px; font-weight: 400; color: var(--acc); }
  #roundinfo span { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }
  #players { flex: 1; display: flex; gap: 12px; justify-content: center; flex-wrap: nowrap; min-width: 0; }
  .pl { --c: #888; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 8px 14px 8px 10px; min-width: 0;
    transition: box-shadow .3s, transform .3s; }
  .pl .av { width: 44px; height: 44px; grid-row: 1 / span 2; }
  .pl .who { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .pl .nm { font-size: 24px; line-height: 1; }
  .pl .tag { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 6px; border-radius: 8px; background: var(--c); color: #16100b; font-weight: 700; }
  .pl .tag.quiet { background: #3b2d22; color: var(--ink); font-weight: 500; }
  .pl .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pl .dice-row { display: flex; gap: 3px; }
  .pl .dice-row svg { width: 22px; height: 22px; }
  .pl .dice-row svg.used { opacity: .22; }
  .pl .cars { display: flex; gap: 4px; }
  .car { min-width: 24px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--c); color: #16100b; font-weight: 800; font-size: 11px;
    display: flex; align-items: center; justify-content: center; gap: 2px; }
  .car.inop { background: repeating-linear-gradient(45deg, #5a5a5a 0 4px, #3c3c3c 4px 8px); color: #ffd23a; }
  .car.elim { background: #2a211b; color: #6f6257; text-decoration: line-through; }
  .car i { width: 5px; height: 5px; border-radius: 50%; background: #d42f30; display: inline-block; }
  .pl .extra { font-size: 11px; opacity: .85; }
  .pl .extra b { color: var(--c); font-weight: 700; }
  .pl.turn { box-shadow: 0 0 0 2px var(--c), 0 0 26px 6px var(--c); transform: translateY(2px) scale(1.03); animation: glow 1.6s ease-in-out infinite; }
  .pl.decides:not(.turn) { box-shadow: 0 0 0 2px var(--c); }
  .pl.out { opacity: .45; filter: grayscale(.7); }
  @keyframes glow { 50% { box-shadow: 0 0 0 2px var(--c), 0 0 40px 12px var(--c); } }
  .road { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .road svg { width: 48px; height: 48px; }
  .road span { font-size: 15px; line-height: 1; text-align: right; }

  /* Bar: the turn's phases, the prompt, actions, tools */
  #bar { position: fixed; left: 0; right: 0; height: var(--bar); bottom: var(--bottom); display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: linear-gradient(rgba(34,24,16,.96), rgba(22,15,10,.98)); border-top: 1px solid #4a3523; box-shadow: 0 -8px 20px rgba(0,0,0,.35); box-sizing: border-box; z-index: 2; }
  #steps { display: flex; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .st { position: relative; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 20px 0 26px; margin-left: -12px; background: #33271d; color: #9c8a73;
    clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%, 13px 50%); transition: background .25s, color .25s, transform .25s; white-space: nowrap; }
  .st:first-child { margin-left: 0; clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%); padding-left: 14px; }
  .st b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.35); font-size: 12px; font-weight: 700; }
  .st span { font-family: 'League Gothic', Impact, sans-serif; font-size: 20px; letter-spacing: .6px; }
  .st small { font-size: 10px; opacity: .8; }
  .st.done { background: color-mix(in srgb, var(--who) 38%, #33271d); color: #e9dcc6; }
  .st.on { background: var(--who); color: #16100b; transform: scale(1.06); z-index: 1; }
  .st.on b { background: rgba(0,0,0,.75); color: var(--who); }
  .st.off span { text-decoration: line-through; opacity: .6; }
  #prompt { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  #prompt b { font-family: 'League Gothic', Impact, sans-serif; font-weight: 400; font-size: 24px; margin-right: 7px; }
  #actions { position: fixed; display: none; gap: 6px; transform: translate(-50%, -100%); z-index: 4; padding: 6px; border-radius: 13px;
    background: rgba(20,14,10,.85); box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  #actions button, .tool { min-height: 32px; padding: 4px 12px; font: inherit; font-weight: 600; border: 0; border-radius: 9px;
    background: #e8742a; color: #1a120c; cursor: pointer; white-space: nowrap; }
  #actions button.quiet, .tool { background: #3b2d22; color: var(--ink); font-weight: 500; }
  .tool.offed { opacity: .45; }
  #actions button.danger { background: #8c2a20; color: #fff; }

  /* Bottom: the player's strip (command board and dashboards as in the rulebook). It is anchored
     to the bottom edge: the expansions' taller strip grows upward. */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom); display: flex; align-items: flex-end; justify-content: center; padding: 0 12px 6px;
    background: radial-gradient(120% 140% at 50% 0%, #2b1d12, #120b06); box-sizing: border-box; z-index: 2; }
  #strip > svg { height: var(--sh); width: auto; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  #strip .loose { display: flex; align-items: center; height: var(--sh); }
  #strip .loose svg { height: 80%; width: auto; }
  /* My dice float over the table's lower edge: drag one onto a board or onto a car. */
  #mydice { position: fixed; left: 14px; bottom: calc(var(--bottom) + var(--bar) + 12px); display: flex; gap: 8px; padding: 8px 10px; z-index: 4; }
  #mydice:empty { display: none; }
  #mydice svg { width: 58px; height: 58px; cursor: grab; border-radius: 10px; transition: transform .12s; touch-action: none; }
  #mydice svg.used { opacity: .18; cursor: default; }
  #mydice svg.sel { transform: translateY(-6px) scale(1.12); box-shadow: 0 0 0 3px var(--hot); }
  #mydice svg.idle { cursor: default; }
  .hotzone { cursor: pointer; }

  /* Rolled dice, big, in the middle of the screen; comic words over the action */
  #rolls { position: fixed; left: 50%; bottom: calc(var(--bottom) + var(--bar) + 14px); transform: translate(-50%, 12px); display: flex; gap: 18px; padding: 12px 20px 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 5; border-radius: 18px;
    background: rgba(20,14,10,.9); border: 2px solid var(--acc); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #rolls.show { opacity: 1; transform: translate(-50%, 0); }
  #rolls .roll { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 96px; }
  #rolls .roll svg { width: 84px; height: 84px; }
  #rolls .roll b { font-family: 'League Gothic', Impact, sans-serif; font-weight: 400; font-size: 22px; color: var(--acc); line-height: 1; }
  #rolls .roll span { font-size: 13px; max-width: 150px; text-align: center; line-height: 1.15; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .word { position: absolute; transform: translate(-50%, -50%); font: 400 54px 'League Gothic', Impact, sans-serif; letter-spacing: 1px; color: #fff;
    -webkit-text-stroke: 2px #16100b; paint-order: stroke fill; text-shadow: 0 4px 0 #16100b, 0 0 24px var(--wc, #ff6a2a); white-space: nowrap; will-change: transform, opacity; }
  .word.big { font-size: 84px; }

  /* Dice are drawn in 3D by an overlay; their SVG stays for layout and clicks. */
  [data-die3d] { opacity: 0; }
  #actions button.shoot { background: #ffd23a; }
  #roundbox { position: fixed; left: 50%; top: calc(var(--top) + 30px); transform: translate(-50%, -10px) scale(.96); opacity: 0; pointer-events: none;
    background: rgba(20,14,10,.94); border: 2px solid var(--acc); border-radius: 14px; padding: 10px 18px 14px; z-index: 6; transition: opacity .25s, transform .25s; }
  #roundbox.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #roundbox h2 { margin: 0 0 6px; font-size: 40px; font-weight: 400; color: var(--acc); text-align: center; }
  #roundbox .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #roundbox .row .av { width: 30px; height: 30px; }
  #roundbox .row span { font-size: 22px; min-width: 90px; }
  #roundbox .row svg { width: 40px; height: 40px; }
  #roundbox .row em { margin-left: 10px; font-size: 12px; color: var(--acc); font-style: normal; }
  .road.glow { box-shadow: 0 0 0 2px #f2c230, 0 0 26px 6px #f2c230; }
  .road.glow span { color: #f2c230; }
  #actions button.road { background: #f2c230; }
  #handoff { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; z-index: 8;
    background: rgba(20,14,10,.95); border: 4px solid var(--who, var(--acc)); border-radius: 16px; padding: 14px 34px 16px; text-align: center;
    box-shadow: 0 0 40px var(--who, transparent); transition: opacity .25s, transform .25s; }
  #handoff.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #handoff small { display: block; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: .8; }
  #handoff b { display: block; font-size: 54px; font-weight: 400; line-height: 1.05; color: var(--who); }
  #handoff span { display: block; margin-top: 4px; font-size: 16px; font-weight: 600; }
  #toast { position: fixed; left: 50%; top: calc(var(--top) + 12px); transform: translate(-50%, -8px); min-width: 280px; max-width: 70vw;
    background: rgba(20,14,10,.92); border: 2px solid var(--acc); border-radius: 10px; padding: 8px 14px; font-size: 16px; font-weight: 600;
    text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 6; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast div { padding: 2px 0; }
  #ghost { position: fixed; width: 44px; height: 44px; pointer-events: none; z-index: 9; display: none; filter: drop-shadow(0 6px 8px #000); }

  #drawer { position: fixed; right: 0; top: 0; bottom: calc(var(--bottom) + var(--bar)); width: min(380px, 90vw); background: rgba(24,16,10,.97);
    border-left: 2px solid #3b2a1c; overflow: auto; padding: 8px 12px; box-sizing: border-box; display: none; z-index: 3; }
  #drawer div { padding: 3px 0; border-bottom: 1px solid #2c1f15; }
  #drawer img { width: 18px; height: 18px; vertical-align: -4px; margin-right: 3px; }
  .dice { color: #9fd3ff; } .bad { color: #ff9b8a; } .good { color: #9be39b; font-weight: 700; } .turn { color: var(--acc); font-weight: 700; }

  #setup { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,6,3,.85); z-index: 10; }
  #setup .card { background: var(--card); padding: 22px 26px; border-radius: 14px; width: min(520px, 92vw); box-shadow: 0 10px 40px #000; }
  #setup h1 { font: 400 44px 'League Gothic', Impact, sans-serif; color: var(--acc); margin: 0 0 8px; }
  #setup label { display: block; margin: 10px 0 4px; font-weight: 600; }
  #setup input, #setup select { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #5a4330; background: #120c07; color: var(--ink); }
  #setup .names { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  #setup .go { margin-top: 16px; width: 100%; min-height: 48px; font-size: 18px; background: #e8742a; color: #1a120c; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
  #win { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.55); z-index: 8; }
  #win .card { background: var(--card); padding: 24px 30px; border-radius: 14px; text-align: center; }
  #win .big { font: 400 56px 'League Gothic', Impact, sans-serif; color: var(--acc); }
</style>
</head>
<body>
<div id="top">
  <div class="bubble" id="roundinfo"></div>
  <div id="players"></div>
  <div class="bubble road"><span class="gothic">DADO<br>STRADA</span><div id="roaddie"></div></div>
</div>
<div id="fx"></div>
<div id="rolls"></div>
<div id="toast"></div>
<div id="handoff"></div>
<div id="roundbox"></div>
<div id="drawer"></div>
<div id="bar">
  <div id="steps"></div>
  <div id="prompt"></div>
  <button class="tool" id="skip" title="Salta l’animazione (barra spaziatrice)">⏭</button>
  <button class="tool" id="ticker" title="Cronaca della partita">☰</button>
  <button class="tool" id="grid" title="Mostra o nascondi le linee delle caselle (G)">▦</button>
  <button class="tool" id="undo" title="Annulla l'ultima scelta">↶</button>
  <button class="tool" id="menu" title="Nuova partita">⟳</button>
</div>
<div id="actions"></div>
<div class="bubble" id="mydice"></div>
<div id="bottom"><div id="strip"></div></div>
<div id="ghost"></div>
<div id="setup">
  <div class="card">
    <h1>Thunder Road Vendetta</h1>
    <label>Giocatori</label>
    <select id="np"><option>2</option><option selected>3</option><option>4</option></select>
    <label>Nomi e colori</label>
    <div class="names">
      <input id="n0"><input id="n1"><input id="n2"><input id="n3">
    </div>
    <label>Tessera di partenza</label>
    <select id="side"><option value="a">1a — The Parking Lot</option><option value="b">1b — Runway to Ruin</option></select>
    <button class="go" id="start">Si parte!</button>
  </div>
</div>
<div id="win"><div class="card"><div class="big" id="wintext"></div><button class="tool" id="again">Nuova partita</button> <button class="tool" id="close">Guarda il tavolo</button></div></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
