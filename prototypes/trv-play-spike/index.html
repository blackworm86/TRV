<!-- PROTOTYPE - NOT FOR PRODUCTION. Partita hot seat giocabile: grafica vettoriale, interfaccia dallo schizzo dell'utente. -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunder Road Vendetta — hot seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
<style>
  :root { --top: 64px; --bar: 44px; --bottom: 170px; --ink: #f3e6d0; --bg: #1a120c; --card: #24180f; --acc: #f6c46a; --hot: #4cff7a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 14px/1.3 system-ui, sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; left: 0; top: var(--top); touch-action: none; }
  .gothic { font-family: 'League Gothic', Impact, sans-serif; letter-spacing: .4px; }
  svg { display: block; }

  /* Top bar: me, opponents, road die */
  #top { position: fixed; left: 0; right: 0; top: 0; height: var(--top); display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: linear-gradient(#2a1c12, #1d140d); border-bottom: 2px solid #3b2a1c; box-sizing: border-box; }
  .me { display: flex; align-items: center; gap: 8px; min-width: 180px; }
  .me .av { width: 46px; height: 46px; }
  .me .nm { font-size: 26px; }
  #opps { flex: 1; display: flex; gap: 8px; justify-content: center; overflow: hidden; }
  .opp { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px; background: #2c2016; border-left: 5px solid; }
  .opp.out { opacity: .4; }
  .opp .av { width: 30px; height: 30px; }
  .opp .nm { font-size: 18px; }
  .dice-row { display: flex; gap: 3px; }
  .dice-row svg { width: 20px; height: 20px; }
  .dice-row svg.used { opacity: .22; }
  .road { display: flex; align-items: center; gap: 6px; }
  .road svg { width: 44px; height: 44px; }
  .road span { font-size: 15px; line-height: 1; text-align: right; }

  /* Prompt bar */
  #bar { position: fixed; left: 0; right: 0; height: var(--bar); bottom: var(--bottom); display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: rgba(24,16,10,.94); border-top: 2px solid #3b2a1c; box-sizing: border-box; }
  #prompt { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  #prompt b { font-family: 'League Gothic', Impact, sans-serif; font-weight: 400; font-size: 20px; margin-right: 6px; }
  #actions { display: flex; gap: 6px; flex: none; }
  #actions button, .tool { min-height: 32px; padding: 4px 10px; font: inherit; font-weight: 600; border: 0; border-radius: 7px;
    background: #e8742a; color: #1a120c; cursor: pointer; white-space: nowrap; }
  #actions button.quiet, .tool { background: #3b2d22; color: var(--ink); font-weight: 500; }
  #actions button.danger { background: #8c2a20; color: #fff; }
  #ticker { flex: 1; min-width: 60px; text-align: right; opacity: .8; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #ticker img { width: 16px; height: 16px; vertical-align: -3px; }

  /* Bottom: my dice, command board, dashboards, chopper */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom); display: flex; align-items: flex-end; gap: 10px; padding: 8px 10px;
    background: linear-gradient(#24180f, #150e08); box-sizing: border-box; }
  #mydice { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-self: center; }
  #mydice svg { width: 40px; height: 40px; cursor: grab; border-radius: 8px; transition: transform .12s; touch-action: none; }
  #mydice svg.used { opacity: .18; cursor: default; }
  #mydice svg.sel { transform: translateY(-6px) scale(1.12); box-shadow: 0 0 0 3px var(--hot); }
  #mydice svg.idle { cursor: default; }
  #cmd { height: 100%; aspect-ratio: 220 / 190; flex: none; }
  #cmd svg { height: 100%; width: 100%; }
  #dashes { display: flex; gap: 8px; flex: 1; height: 100%; min-width: 0; }
  #dashes > svg { height: 100%; width: auto; aspect-ratio: 260 / 150; max-width: 33%; }
  #chopper { width: 64px; align-self: center; text-align: center; font-size: 12px; flex: none; }
  .hotzone { cursor: pointer; }

  /* Dice are drawn in 3D by an overlay; their SVG stays for layout and clicks. */
  [data-die3d] { opacity: 0; }
  #steps { display: flex; gap: 2px; flex: none; }
  #steps span { padding: 3px 7px; border-radius: 5px; font-size: 12px; background: #2c2016; color: #9c8a73; white-space: nowrap; }
  #steps span.done { color: #d8c7ad; }
  #steps span.on { background: var(--acc); color: #1a120c; font-weight: 700; }
  #steps span.off { text-decoration: line-through; opacity: .6; }
  #actions button.shoot { background: #ffd23a; }
  #toast { position: fixed; left: 50%; top: calc(var(--top) + 12px); transform: translate(-50%, -8px); min-width: 280px; max-width: 70vw;
    background: rgba(20,14,10,.92); border: 2px solid var(--acc); border-radius: 10px; padding: 8px 14px; font-size: 16px; font-weight: 600;
    text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 6; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast div { padding: 2px 0; }
  #ghost { position: fixed; width: 44px; height: 44px; pointer-events: none; z-index: 9; display: none; filter: drop-shadow(0 6px 8px #000); }

  #drawer { position: fixed; right: 0; top: var(--top); bottom: calc(var(--bottom) + var(--bar)); width: min(380px, 90vw); background: rgba(24,16,10,.97);
    border-left: 2px solid #3b2a1c; overflow: auto; padding: 8px 12px; box-sizing: border-box; display: none; z-index: 3; }
  #drawer div { padding: 3px 0; border-bottom: 1px solid #2c1f15; }
  #drawer img { width: 18px; height: 18px; vertical-align: -4px; margin-right: 3px; }
  .dice { color: #9fd3ff; } .bad { color: #ff9b8a; } .good { color: #9be39b; font-weight: 700; } .turn { color: var(--acc); font-weight: 700; }

  #setup { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,6,3,.85); z-index: 10; }
  #setup .card { background: var(--card); padding: 22px 26px; border-radius: 14px; width: min(520px, 92vw); box-shadow: 0 10px 40px #000; }
  #setup h1 { font: 400 44px 'League Gothic', Impact, sans-serif; color: var(--acc); margin: 0 0 8px; }
  #setup label { display: block; margin: 10px 0 4px; font-weight: 600; }
  #setup input, #setup select { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #5a4330; background: #120c07; color: var(--ink); }
  #setup .names { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  #setup .go { margin-top: 16px; width: 100%; min-height: 48px; font-size: 18px; background: #e8742a; color: #1a120c; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
  #win { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.55); z-index: 8; }
  #win .card { background: var(--card); padding: 24px 30px; border-radius: 14px; text-align: center; }
  #win .big { font: 400 56px 'League Gothic', Impact, sans-serif; color: var(--acc); }
</style>
</head>
<body>
<div id="top">
  <div class="me"><div class="av" id="meav"></div><div class="nm gothic" id="mename"></div></div>
  <div id="opps"></div>
  <div class="road"><span class="gothic">DADO<br>STRADA</span><div id="roaddie"></div></div>
</div>
<div id="toast"></div>
<div id="drawer"></div>
<div id="bar">
  <div id="steps"></div>
  <div id="prompt"></div>
  <div id="actions"></div>
  <div id="ticker" title="Apri la cronaca"></div>
  <button class="tool" id="undo" title="Annulla l'ultima scelta">↶</button>
  <button class="tool" id="menu" title="Nuova partita">☰</button>
</div>
<div id="bottom">
  <div id="mydice"></div>
  <div id="cmd"></div>
  <div id="dashes"></div>
  <div id="chopper"></div>
</div>
<div id="ghost"></div>
<div id="setup">
  <div class="card">
    <h1>Thunder Road Vendetta</h1>
    <label>Giocatori</label>
    <select id="np"><option>2</option><option selected>3</option><option>4</option></select>
    <label>Nomi e colori</label>
    <div class="names">
      <input id="n0"><input id="n1"><input id="n2"><input id="n3">
    </div>
    <label>Tessera di partenza</label>
    <select id="side"><option value="a">1a — The Parking Lot</option><option value="b">1b — Runway to Ruin</option></select>
    <button class="go" id="start">Si parte!</button>
  </div>
</div>
<div id="win"><div class="card"><div class="big" id="wintext"></div><button class="tool" id="again">Nuova partita</button> <button class="tool" id="close">Guarda il tavolo</button></div></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
